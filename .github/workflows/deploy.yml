name: Deploy Cartridge
run-name: ${{ inputs.action }} Cartridge to ${{ inputs.environment }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment (configure secrets and protection rules first)
        type: choice
        options: [staging, production]
        default: staging
        required: true
      action:
        description: Plan is read-only remotely; deploy applies migrations and provider configuration
        type: choice
        options: [plan, deploy]
        default: plan
        required: true
permissions:
  contents: read
concurrency:
  group: cartridge-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    # Never deploy an arbitrary branch with production credentials.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CARTRIDGE_SITE_URL: ${{ vars.CARTRIDGE_SITE_URL }}
      CARTRIDGE_TOKEN_AUDIENCE: ${{ vars.CARTRIDGE_TOKEN_AUDIENCE }}
      CARTRIDGE_OAUTH_CLIENT_IDS: ${{ vars.CARTRIDGE_OAUTH_CLIENT_IDS }}
      CARTRIDGE_ALLOWED_ORIGINS: ${{ vars.CARTRIDGE_ALLOWED_ORIGINS }}
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      POLAR_RUNTIME_ACCESS_TOKEN: ${{ secrets.POLAR_RUNTIME_ACCESS_TOKEN }}
      POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID }}
      POLAR_PRODUCT_CREDITS: ${{ vars.POLAR_PRODUCT_CREDITS }}
      POLAR_SERVER: ${{ vars.POLAR_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - run: npm ci
      - run: npm run check
      - run: deno check --config supabase/functions/deno.json supabase/functions/mcp/index.ts supabase/functions/billing-webhook/index.ts supabase/functions/stripe-webhook/index.ts
      - name: Plan
        if: inputs.action == 'plan'
        run: npx tsx scripts/deploy.ts --plan
      - name: Deploy
        if: inputs.action == 'deploy'
        run: npx tsx scripts/deploy.ts
      - name: Upload public consent site
        uses: actions/upload-artifact@v4
        with:
          name: consent-site-${{ inputs.environment }}
          path: public/
          retention-days: 7
      - name: Upload agent integration files
        uses: actions/upload-artifact@v4
        with:
          name: cartridge-${{ inputs.environment }}
          path: dist/
          include-hidden-files: true
          retention-days: 7
